<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Geral · Reserva Exclusiva</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=Outfit:wght@380;520&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#070705; --fg:#f6f1e4; --gold:#e0c36a; --muted:#c4b79a; --surface:#14140f; --line:rgba(224,195,106,.35); }
    body { margin:0; min-height:100dvh; background:var(--bg); color:var(--fg); font-family:Outfit,sans-serif; padding:2rem; }
    h1 { font-family:Fraunces,serif; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:1.2rem; padding:1.2rem; margin:1rem 0; max-width:48rem; }
    a, button.link { color:var(--gold); background:none; border:0; cursor:pointer; }
    .row { display:flex; justify-content:space-between; align-items:center; padding:.6rem 0; border-bottom:1px solid var(--line); }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div id="gate" class="hidden">
    <p>Acesso restrito. <a href="../login/">Entrar</a></p>
  </div>
  <div id="app" class="hidden">
    <a href="../">← Raiz</a>
    <h1>Admin Geral</h1>
    <p class="muted" id="who"></p>
    <div class="card">
      <h2>Marcas / Slugs</h2>
      <div id="tenants"></div>
      <p class="muted">Cada slug é isolado. O Admin Geral pode listar e editar o conteúdo da raiz e das marcas.</p>
    </div>
    <div class="card">
      <h2>Página pública (raiz)</h2>
      <p>Banner e texto de marketing são controlados aqui.</p>
      <button class="link" onclick="alert('Edição da raiz disponível no app dinâmico (Convex + auth).')">Editar banner da raiz</button>
    </div>
    <button class="link" onclick="logout()">Sair</button>
  </div>
  <script>
    const session = JSON.parse(localStorage.getItem("reserva-session") || "null");
    if (!session || !session.email) {
      document.getElementById("gate").classList.remove("hidden");
    } else {
      document.getElementById("app").classList.remove("hidden");
      document.getElementById("who").textContent = "Logado como " + session.email;
      document.getElementById("tenants").innerHTML = `
        <div class="row"><span><strong>/domricardo</strong> · postagem inicial</span><a href="../domricardo/">Abrir</a></div>
        <div class="row"><span><strong>/</strong> · página de marketing</span><a href="../">Abrir</a></div>
      `;
    }
    function logout() {
      localStorage.removeItem("reserva-session");
      location.href = "../login/";
    }
  </script>
</body>
</html>
