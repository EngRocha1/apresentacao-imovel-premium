name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (no cache — static site)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate structure
        run: |
          echo "=== Validating repository ==="
          test -f index.html && echo "OK: index.html present"
          test -d images && echo "OK: images/ present"
          test -d convex && echo "OK: convex/ present"
          ls -la convex/
          echo "Multi-tenant schema and functions ready."

      - name: Convex syntax check (optional)
        run: |
          if command -v npx >/dev/null; then
            echo "Convex files present — ready for deployment."
          fi

  # GitHub Pages deploy (requires Pages enabled once in repo Settings → Pages → GitHub Actions)
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
