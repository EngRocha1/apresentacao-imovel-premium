name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate structure
        run: |
          echo "=== Validating repository ==="
          test -f index.html && echo "OK: index.html"
          test -d images && echo "OK: images/"
          test -d convex && echo "OK: convex/"
          ls convex/
          echo "Multi-tenant ready."

  # Pages deploy — only runs if Pages is already enabled.
  # Enable once manually: Settings → Pages → Source = GitHub Actions
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      pages: write
      id-token: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.configure.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@v4
