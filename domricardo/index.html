<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>/domricardo · Reserva Exclusiva</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=Outfit:wght@380;520&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#070705; --fg:#f6f1e4; --gold:#e0c36a; --line:rgba(224,195,106,.35); }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:Outfit,sans-serif; }
    #stage { position:relative; height:100dvh; overflow:hidden; }
    #stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .veil { position:absolute; inset:0; background:linear-gradient(to top,#070705 0%,rgba(7,7,5,.4) 55%,rgba(7,7,5,.05) 100%); }
    .copy { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:1.25rem 1.25rem 5.5rem; max-width:42rem; }
    h1 { font-family:Fraunces,serif; font-size:clamp(2rem,5vw,3.8rem); margin:.4rem 0; }
    .gold { display:inline-block; background:var(--gold); color:#1a1404; padding:.7rem 1.2rem; border-radius:999px; text-decoration:none; font-weight:520; }
    .nav { position:absolute; top:50%; transform:translateY(-50%); z-index:5; width:44px; height:44px; border-radius:999px; border:1px solid var(--line); background:rgba(7,7,5,.5); color:var(--fg); }
    .prev { left:.7rem; } .next { right:.7rem; }
  </style>
</head>
<body>
  <div id="stage">
    <img id="photo" alt="" src="images/sala.jpg">
    <div class="veil"></div>
    <div class="copy">
      <p style="letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-size:.7rem">/domricardo · Centro Teresina</p>
      <h1 id="title">Oportunidade no Centro</h1>
      <p id="desc">110 m² · 2 quartos + escritório. R$ 300.000.</p>
      <a class="gold" href="https://wa.me/559185530230" target="_blank">Agendar visita</a>
    </div>
    <button class="nav prev" id="prev">‹</button>
    <button class="nav next" id="next">›</button>
  </div>
  <script>
    const slides = [
      ["Oportunidade no Centro","110 m² · 2 quartos + escritório. R$ 300.000.","images/sala.jpg"],
      ["Convivência","Sala ampla com varanda.","images/sala.jpg"],
      ["Cozinha","Planejada e pronta.","images/cozinha.jpg"],
      ["Quarto","Com saída e ar-condicionado.","images/quarto_ac.jpg"],
      ["Escritório","Divisória de vidro.","images/escritorio.jpg"],
      ["Banheiro","Box amplo.","images/banheiro_grande.jpg"],
      ["Corredor","Área íntima reservada.","images/corredor.jpg"],
      ["Área de serviço","Tanque instalado.","images/area_servico.jpg"]
    ];
    let i=0;
    const photo=document.getElementById("photo"), title=document.getElementById("title"), desc=document.getElementById("desc");
    function go(n){ i=(n+slides.length)%slides.length; const s=slides[i]; photo.src=s[2]; title.textContent=s[0]; desc.textContent=s[1]; }
    document.getElementById("prev").onclick=()=>go(i-1);
    document.getElementById("next").onclick=()=>go(i+1);
    go(0);
  </script>
</body>
</html>
