<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reserva Exclusiva · /domricardo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=Outfit:wght@380;520&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#070705; --fg:#f6f1e4; --muted:#c4b79a; --gold:#e0c36a; --line:rgba(224,195,106,.35); --surface:#14140f; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:Outfit,sans-serif; }
    button, a { font:inherit; color:inherit; }
    button { cursor:pointer; }
    #stage { position:relative; height:100dvh; width:100%; overflow:hidden; background:#111; }
    #stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .veil { position:absolute; inset:0; background:linear-gradient(to top, #070705 0%, rgba(7,7,5,.45) 50%, rgba(7,7,5,.08) 100%); pointer-events:none; }
    .copy { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:1.25rem 1.25rem 6.5rem; max-width:46rem; }
    .kicker { letter-spacing:.28em; text-transform:uppercase; color:var(--gold); font-size:.72rem; margin:0 0 .6rem; }
    h1 { font-family:Fraunces,serif; font-weight:520; font-size:clamp(2.2rem,5.5vw,4.4rem); line-height:1.02; margin:0 0 .7rem; }
    .desc { margin:0; max-width:38rem; line-height:1.5; font-size:1.05rem; }
    .actions { display:flex; flex-wrap:wrap; gap:.7rem; margin-top:1.1rem; }
    .gold, .ghost { min-height:44px; border-radius:999px; padding:0 1.1rem; display:inline-flex; align-items:center; text-decoration:none; }
    .gold { background:var(--gold); color:#1a1404; border:0; font-weight:520; }
    .ghost { background:transparent; border:1px solid var(--line); }
    header.bar, .nav, .dots, .wa { position:absolute; z-index:5; }
    header.bar { top:0; left:0; right:0; display:flex; justify-content:space-between; gap:1rem; padding:1.1rem 1.1rem 0; }
    .brand small { display:block; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); font-size:.68rem; }
    .brand strong { font-family:Fraunces,serif; font-size:1.45rem; font-weight:520; }
    .nav { top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:999px; border:1px solid var(--line); background:rgba(7,7,5,.45); }
    .nav.prev { left:.7rem; } .nav.next { right:.7rem; }
    .dots { left:0; right:0; bottom:1.2rem; display:flex; justify-content:center; gap:.35rem; }
    .dots button { height:6px; width:6px; border:0; border-radius:99px; background:rgba(246,241,228,.35); padding:0; }
    .dots button.on { width:24px; background:var(--gold); }
    .wa { left:1rem; bottom:1rem; width:56px; height:56px; border-radius:999px; border:0; background:var(--gold); color:#1a1404; font-weight:520; }
  </style>
</head>
<body>
  <div id="stage">
    <img id="photo" alt="Sala" src="images/sala.jpg">
    <div class="veil"></div>
    <header class="bar">
      <div class="brand"><small>Centro · Teresina · /domricardo</small><strong>Reserva Exclusiva</strong></div>
    </header>
    <div class="copy">
      <p class="kicker" id="kicker">110 m² · Centro Sul</p>
      <h1 id="title">Oportunidade no Centro</h1>
      <p class="desc" id="desc">110 m² · 2 quartos + escritório. R$ 300.000, aberto a negociação.</p>
      <div class="actions">
        <a class="gold" href="https://wa.me/559185530230?text=Ol%C3%A1%2C%20vi%20a%20Reserva%20Exclusiva%20no%20Centro%20e%20quero%20agendar%20uma%20visita." target="_blank" rel="noreferrer">Agendar visita</a>
        <a class="ghost" href="https://wa.me/5586981830140?text=Ol%C3%A1%2C%20vi%20a%20Reserva%20Exclusiva%20no%20Centro%20e%20quero%20agendar%20uma%20visita." target="_blank" rel="noreferrer">WhatsApp</a>
      </div>
    </div>
    <button class="nav prev" id="prev" type="button" aria-label="Anterior">‹</button>
    <button class="nav next" id="next" type="button" aria-label="Próximo">›</button>
    <div class="dots" id="dots"></div>
    <button class="wa" type="button" aria-label="WhatsApp" onclick="location.href='https://wa.me/559185530230'">WA</button>
  </div>
  <script>
    const slides = [
      { title:"Oportunidade no Centro", desc:"110 m² · 2 quartos + escritório. R$ 300.000, aberto a negociação.", img:"images/sala.jpg", kicker:"110 m² · Centro Sul" },
      { title:"Convivência e amplitude", desc:"Sala ampla com varanda, luz de fim de tarde e espaço para receber.", img:"images/sala.jpg", kicker:"Reserva Exclusiva" },
      { title:"O coração da casa", desc:"Cozinha planejada, semimobiliada, pronta para a rotina.", img:"images/cozinha.jpg", kicker:"Reserva Exclusiva" },
      { title:"Espaço de sobra", desc:"Bancada em L, forno e circulação larga.", img:"images/cozinha_panorama.jpg", kicker:"Reserva Exclusiva" },
      { title:"Conforto e descanso", desc:"Quarto com saída para a área externa e ponto de ar-condicionado.", img:"images/quarto_ac.jpg", kicker:"Reserva Exclusiva" },
      { title:"Ambientes arejados", desc:"Janela alta, piso claro e ventilação cruzada.", img:"images/quarto.jpg", kicker:"Reserva Exclusiva" },
      { title:"Versatilidade", desc:"Escritório com divisória de vidro. Vira quarto ou home office.", img:"images/escritorio.jpg", kicker:"Reserva Exclusiva" },
      { title:"Modernidade", desc:"Banheiro principal com box amplo e bancada escura.", img:"images/banheiro_grande.jpg", kicker:"Reserva Exclusiva" },
      { title:"Praticidade", desc:"Segundo banheiro, acabamento alinhado ao principal.", img:"images/banheiro_escritorio.jpg", kicker:"Reserva Exclusiva" },
      { title:"Distribuição inteligente", desc:"Corredor curto. A área íntima fica reservada da sala.", img:"images/corredor.jpg", kicker:"Reserva Exclusiva" },
      { title:"Funcionalidade", desc:"Área de serviço longa, isolada e com tanque instalado.", img:"images/area_servico.jpg", kicker:"Reserva Exclusiva" },
      { title:"Agende sua visita", desc:"R. Clodoaldo Freitas, 1060 · Centro (Sul), Teresina. Portaria facial e câmeras 24h.", img:"images/sala.jpg", kicker:"Teresina · PI" }
    ];
    let i = 0;
    const photo = document.getElementById("photo");
    const title = document.getElementById("title");
    const desc = document.getElementById("desc");
    const kicker = document.getElementById("kicker");
    const dots = document.getElementById("dots");
    function render() {
      const s = slides[i];
      photo.src = s.img;
      title.textContent = s.title;
      desc.textContent = s.desc;
      kicker.textContent = s.kicker;
      dots.innerHTML = slides.map((_, idx) => `<button type="button" class="${idx===i?'on':''}" data-i="${idx}"></button>`).join("");
    }
    function go(n) { i = (n + slides.length) % slides.length; render(); }
    document.getElementById("prev").onclick = () => go(i-1);
    document.getElementById("next").onclick = () => go(i+1);
    dots.onclick = (e) => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); };
    render();
  </script>
</body>
</html>
