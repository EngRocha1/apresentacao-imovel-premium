<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar propaganda · Reserva Exclusiva</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=Outfit:wght@380;520&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#070705; --fg:#f6f1e4; --gold:#e0c36a; --muted:#c4b79a; }
    body { margin:0; min-height:100dvh; background:var(--bg); color:var(--fg); font-family:Outfit,sans-serif; display:grid; place-items:center; padding:2rem; }
    h1 { font-family:Fraunces,serif; font-size:clamp(2.5rem,6vw,4.5rem); margin:0 0 1rem; }
    p { max-width:36rem; line-height:1.6; color:var(--muted); }
    .gold { display:inline-block; margin-top:1.5rem; background:var(--gold); color:#1a1404; padding:.8rem 1.6rem; border-radius:999px; text-decoration:none; font-weight:520; }
    .links { margin-top:2rem; display:flex; gap:1rem; flex-wrap:wrap; }
    .links a { color:var(--gold); text-decoration:none; }
  </style>
</head>
<body>
  <div>
    <p style="letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-size:.75rem">Marketing imobiliário</p>
    <h1>Fazemos a propaganda do seu imóvel.</h1>
    <p>Página pública de criação de postagens. Cada marca tem seu slug isolado. O Admin Geral controla banners e conteúdo da raiz. O AdminCliente edita só a sua área.</p>
    <a class="gold" href="login/">Criar acesso / Login</a>
    <div class="links">
      <a href="domricardo/">Ver /domricardo</a>
      <a href="admin/">Área admin</a>
    </div>
  </div>
</body>
</html>
