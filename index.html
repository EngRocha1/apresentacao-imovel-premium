<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reserva Exclusiva | Imóvel Alto Padrão - Centro Teresina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Playfair Display', 'serif'],
          },
          colors: {
            gold: '#D4AF37',
            goldLight: '#F4E4B8',
            neon: '#FFD700',
            dark: '#0A0A0A',
            darker: '#050505',
            card: '#111111',
          },
          boxShadow: {
            neon: '0 0 20px rgba(212, 175, 55, 0.4)',
            'neon-strong': '0 0 40px rgba(212, 175, 55, 0.6)',
          }
        }
      }
    }
  </script>
  <style>
    body { background: #050505; color: #fff; overflow: hidden; }
    .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #F4E4B8 50%, #D4AF37 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .neon-border { border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
    .slide-img { transition: transform 8s ease-out; }
    .slide.active .slide-img { transform: scale(1.08); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .floating-wa { animation: pulse-gold 2s infinite; }
    @keyframes pulse-gold {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
      50% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
    }
    .admin-panel { backdrop-filter: blur(20px); }
  </style>
</head>
<body class="font-sans antialiased">

  <!-- LOGIN MODAL -->
  <div id="login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-card neon-border rounded-2xl p-8 max-w-md w-full shadow-neon-strong">
      <h2 class="font-display text-3xl gold-gradient mb-2 text-center">Área Administrativa</h2>
      <p class="text-gray-400 text-center mb-6 text-sm">Acesso restrito para gestão de conteúdo</p>
      <form id="login-form" class="space-y-4">
        <input type="email" id="login-email" placeholder="E-mail" class="w-full bg-darker border border-gray-700 rounded-lg px-4 py-3 focus:border-gold focus:outline-none" required>
        <input type="password" id="login-password" placeholder="Senha" class="w-full bg-darker border border-gray-700 rounded-lg px-4 py-3 focus:border-gold focus:outline-none" required>
        <button type="submit" class="w-full bg-gold text-black font-semibold py-3 rounded-lg hover:bg-goldLight transition">Entrar</button>
      </form>
      <button onclick="mockGoogleLogin()" class="w-full mt-3 border border-gold text-gold py-3 rounded-lg hover:bg-gold/10 transition text-sm">Continuar com Google</button>
      <p class="text-xs text-gray-500 mt-4 text-center">Demo: admin@imovel.com / 123456</p>
      <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="admin-panel" class="fixed inset-0 bg-black/90 z-[90] hidden overflow-y-auto">
    <div class="max-w-6xl mx-auto p-6 admin-panel">
      <div class="flex justify-between items-center mb-8">
        <h2 class="font-display text-3xl gold-gradient">Gestão de Slides & Contatos</h2>
        <div class="flex gap-3">
          <button onclick="saveSlides()" class="bg-gold text-black px-6 py-2 rounded-lg font-semibold">Salvar</button>
          <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="border border-gold text-gold px-6 py-2 rounded-lg">Fechar</button>
        </div>
      </div>
      
      <div class="grid md:grid-cols-2 gap-8">
        <!-- Editor de Slides -->
        <div>
          <h3 class="text-xl mb-4 text-gold">Slides da Apresentação</h3>
          <div id="slides-editor" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2"></div>
          <button onclick="addNewSlide()" class="mt-4 w-full border-2 border-dashed border-gold text-gold py-3 rounded-lg hover:bg-gold/10">+ Adicionar Novo Slide</button>
        </div>
        
        <!-- Contatos -->
        <div>
          <h3 class="text-xl mb-4 text-gold">Contatos & Leads</h3>
          <div id="contacts-list" class="space-y-3 text-sm"></div>
          <div class="mt-6 p-4 bg-darker rounded-xl neon-border">
            <h4 class="font-semibold mb-2">WhatsApp Flutuante</h4>
            <p class="text-gray-400 text-xs">Configurado com os números dos corretores. Clique no botão dourado para contato direto.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN PRESENTATION -->
  <div id="app" class="h-screen w-screen relative">
    <!-- Header -->
    <header class="absolute top-0 left-0 right-0 z-40 flex justify-between items-center p-4 md:p-6">
      <div class="font-display text-2xl md:text-3xl gold-gradient tracking-wider">RESERVA EXCLUSIVA</div>
      <div class="flex items-center gap-3">
        <button onclick="toggleFormat()" id="format-btn" class="text-xs border border-gold/50 text-gold px-3 py-1.5 rounded-full hover:bg-gold/10">Feed 1:1</button>
        <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="text-xs bg-gold/20 border border-gold text-gold px-3 py-1.5 rounded-full">Admin</button>
      </div>
    </header>

    <!-- Carousel Container - Dynamic Fullscreen -->
    <div id="carousel-wrapper" class="absolute inset-0 flex items-center justify-center">
      <div id="carousel-container" class="relative w-full h-full max-w-none transition-all duration-700">
        <div id="carousel-track" class="flex h-full transition-transform duration-700 ease-out"></div>
        
        <!-- Navigation -->
        <button onclick="prevSlide()" class="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-black/40 backdrop-blur border border-gold/30 text-gold flex items-center justify-center hover:bg-gold hover:text-black transition z-30">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button onclick="nextSlide()" class="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-black/40 backdrop-blur border border-gold/30 text-gold flex items-center justify-center hover:bg-gold hover:text-black transition z-30">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>

        <!-- Dots -->
        <div id="dots" class="absolute bottom-6 left-0 right-0 flex justify-center gap-2 z-30"></div>
      </div>
    </div>

    <!-- Slide Counter -->
    <div id="counter" class="absolute bottom-6 right-6 text-gold text-sm font-medium z-30"></div>
  </div>

  <!-- Floating WhatsApp -->
  <a href="https://wa.me/559185530230" target="_blank" class="floating-wa fixed bottom-6 left-6 z-50 w-14 h-14 bg-gold rounded-full flex items-center justify-center shadow-neon-strong hover:scale-110 transition">
    <svg class="w-8 h-8 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <script>
    // Pre-loaded slides with all provided photos
    const defaultSlides = [
      { id: 1, image: 'images/sala.jpg', title: 'OPORTUNIDADE NO CENTRO', description: '110m² • 2 Quartos + Escritório • R$ 300.000 (Aberto a negociação)', highlight: true },
      { id: 2, image: 'images/sala.jpg', title: 'Convivência e Amplitude', description: 'Sala ampla com varanda, perfeita para receber amigos e família.' },
      { id: 3, image: 'images/cozinha.jpg', title: 'O Coração da Casa', description: 'Cozinha planejada e semimobiliada com excelente padrão de acabamento.' },
      { id: 4, image: 'images/cozinha_panorama.jpg', title: 'Espaço de Sobra', description: 'Visão panorâmica de uma cozinha feita para a sua rotina diária.' },
      { id: 5, image: 'images/quarto_ac.jpg', title: 'Conforto e Descanso', description: 'Um dos 2 amplos quartos do apartamento, com ótima ventilação.' },
      { id: 6, image: 'images/quarto.jpg', title: 'Ambientes Arejados', description: 'Muita iluminação natural e ventilação em todos os ambientes.' },
      { id: 7, image: 'images/escritorio.jpg', title: 'Versatilidade', description: 'Escritório reversível ideal para seu Home Office ou quarto extra.' },
      { id: 8, image: 'images/banheiro_grande.jpg', title: 'Modernidade', description: 'Banheiro principal com acabamento premium e box espaçoso.' },
      { id: 9, image: 'images/banheiro_escritorio.jpg', title: 'Praticidade', description: 'Segundo banheiro com excelente padrão de acabamento e funcionalidade.' },
      { id: 10, image: 'images/corredor.jpg', title: 'Distribuição Inteligente', description: 'Privacidade preservada entre a área social e a área íntima.' },
      { id: 11, image: 'images/area_servico.jpg', title: 'Funcionalidade', description: 'Área de serviço muito espaçosa e isolada, pronta para uso.' },
      { id: 12, image: 'images/sala.jpg', title: 'AGENDE SUA VISITA!', description: 'R. Clodoaldo Freitas, 1060 • Centro (Sul), Teresina - PI • Portaria facial e câmeras 24h', cta: true },
    ];

    let slides = JSON.parse(localStorage.getItem('slides') || 'null') || defaultSlides;
    let currentIndex = 0;
    let isStories = false;
    let contacts = JSON.parse(localStorage.getItem('contacts') || '[]');

    function renderCarousel() {
      const track = document.getElementById('carousel-track');
      const dots = document.getElementById('dots');
      track.innerHTML = '';
      dots.innerHTML = '';
      
      slides.forEach((slide, i) => {
        const div = document.createElement('div');
        div.className = `carousel-slide min-w-full h-full relative flex items-end ${i === currentIndex ? 'active' : ''}`;
        div.innerHTML = `
          <img src="${slide.image}" class="slide-img absolute inset-0 w-full h-full object-cover" alt="${slide.title}">
          <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
          <div class="relative z-10 p-6 md:p-12 w-full text-center md:text-left">
            ${slide.highlight ? `<div class="text-gold text-xs md:text-sm font-bold tracking-[0.2em] uppercase mb-3">110m² • 2 Quartos + Escritório</div>` : ''}
            <h2 class="font-display text-3xl md:text-5xl lg:text-6xl font-bold mb-3 leading-tight ${slide.highlight ? 'gold-gradient' : ''}">${slide.title}</h2>
            <p class="text-gray-200 text-sm md:text-lg max-w-xl mx-auto md:mx-0">${slide.description}</p>
            ${slide.cta ? `
              <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center md:justify-start">
                <a href="https://wa.me/559185530230" class="bg-gold text-black font-bold py-3 px-6 rounded-lg hover:bg-goldLight transition">Falar com Luane</a>
                <a href="https://wa.me/5586981830140" class="border border-gold text-gold font-bold py-3 px-6 rounded-lg hover:bg-gold/10 transition">Falar com Tarcisio</a>
              </div>
            ` : ''}
          </div>
        `;
        track.appendChild(div);

        const dot = document.createElement('button');
        dot.className = `w-2 h-2 rounded-full transition-all ${i === currentIndex ? 'bg-gold w-6' : 'bg-white/40'}`;
        dot.onclick = () => goToSlide(i);
        dots.appendChild(dot);
      });

      updatePosition();
      document.getElementById('counter').textContent = `${currentIndex + 1} / ${slides.length}`;
    }

    function updatePosition() {
      const track = document.getElementById('carousel-track');
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      document.querySelectorAll('.carousel-slide').forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
      });
      document.querySelectorAll('#dots button').forEach((el, i) => {
        el.className = `w-2 h-2 rounded-full transition-all ${i === currentIndex ? 'bg-gold w-6' : 'bg-white/40'}`;
      });
    }

    function nextSlide() { currentIndex = (currentIndex + 1) % slides.length; renderCarousel(); }
    function prevSlide() { currentIndex = (currentIndex - 1 + slides.length) % slides.length; renderCarousel(); }
    function goToSlide(i) { currentIndex = i; renderCarousel(); }

    function toggleFormat() {
      isStories = !isStories;
      const btn = document.getElementById('format-btn');
      const container = document.getElementById('carousel-container');
      if (isStories) {
        btn.textContent = 'Stories 9:16';
        container.classList.add('max-w-md', 'mx-auto');
        container.style.aspectRatio = '9/16';
        container.style.height = 'auto';
        container.style.maxHeight = '90vh';
      } else {
        btn.textContent = 'Feed 1:1';
        container.classList.remove('max-w-md', 'mx-auto');
        container.style.aspectRatio = '';
        container.style.height = '100%';
        container.style.maxHeight = '';
      }
    }

    // Login
    document.getElementById('login-form').onsubmit = (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      if (email === 'admin@imovel.com' && pass === '123456') {
        document.getElementById('login-modal').classList.add('hidden');
        openAdmin();
      } else {
        alert('Credenciais inválidas. Use o demo.');
      }
    };

    function mockGoogleLogin() {
      document.getElementById('login-modal').classList.add('hidden');
      openAdmin();
    }

    function openAdmin() {
      document.getElementById('admin-panel').classList.remove('hidden');
      renderAdmin();
    }

    function renderAdmin() {
      const editor = document.getElementById('slides-editor');
      editor.innerHTML = slides.map((s, i) => `
        <div class="bg-darker p-4 rounded-xl border border-gray-800">
          <div class="flex gap-3">
            <img src="${s.image}" class="w-16 h-16 object-cover rounded">
            <div class="flex-1 space-y-2">
              <input value="${s.title}" onchange="slides[${i}].title=this.value" class="w-full bg-black border border-gray-700 rounded px-2 py-1 text-sm">
              <textarea onchange="slides[${i}].description=this.value" class="w-full bg-black border border-gray-700 rounded px-2 py-1 text-xs" rows="2">${s.description}</textarea>
            </div>
            <button onclick="slides.splice(${i},1); renderAdmin();" class="text-red-400 text-xs">✕</button>
          </div>
        </div>
      `).join('');

      document.getElementById('contacts-list').innerHTML = contacts.length ? contacts.map(c => `
        <div class="bg-darker p-3 rounded-lg border border-gray-800 text-xs">
          <strong>${c.name || 'Lead'}</strong> • ${c.email || ''} • ${c.phone || ''}<br>
          <span class="text-gray-400">${c.message || ''}</span>
        </div>
      `).join('') : '<p class="text-gray-500">Nenhum contato registrado ainda.</p>';
    }

    function addNewSlide() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          slides.push({
            id: Date.now(),
            image: reader.result,
            title: 'Novo Ambiente',
            description: 'Descrição do ambiente'
          });
          renderAdmin();
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }

    function saveSlides() {
      localStorage.setItem('slides', JSON.stringify(slides));
      renderCarousel();
      alert('Slides salvos com sucesso! (armazenados localmente para esta sessão/demo)');
    }

    // Keyboard & Touch
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    let touchStartX = 0;
    document.getElementById('carousel-track').addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
    document.getElementById('carousel-track').addEventListener('touchend', e => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 50) diff > 0 ? nextSlide() : prevSlide();
    });

    // Init
    renderCarousel();

    // Dynamic resize
    window.addEventListener('resize', () => {
      // Force reflow for perfect rendering
      const container = document.getElementById('carousel-container');
      container.style.height = window.innerHeight + 'px';
    });
    window.dispatchEvent(new Event('resize'));
  </script>
</body>
</html>
